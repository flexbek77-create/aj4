<style>
:root{--sat:max(env(safe-area-inset-top,0px),0px);--sab:max(env(safe-area-inset-bottom,0px),0px);--bg:#050607;--gl:rgba(12,16,21,.78);--tx:#E8ECF1;--mu:#8A94A3;--bd:rgba(255,255,255,.05)}
.light{--bg:#EEF0F4;--gl:rgba(255,255,255,.7);--tx:#12161B;--mu:#5B6573;--bd:rgba(0,0,0,.08)}
body{background:var(--bg);color:var(--tx);font-family:'Space Grotesk',system-ui,sans-serif;transition:background .3s}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(520px 320px at 8% 0,rgba(245,196,81,.035),transparent),radial-gradient(520px 420px at 100% 65%,rgba(139,92,246,.06),transparent)}
.glass{background:var(--gl);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--bd);border-radius:20px}
.btn{transition:transform .15s,filter .15s;cursor:pointer}.btn:active{transform:scale(.98)}.btn:hover{filter:brightness(1.1)}
.mu{color:var(--mu)}
.metal{background:linear-gradient(180deg,#fff,#aeb7c4 55%,#e9edf2);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 6px rgba(200,210,225,.25))}
.light .metal{background:linear-gradient(180deg,#12161B,#6b7685);-webkit-background-clip:text;background-clip:text}
.gold{background:linear-gradient(135deg,#FFE08A,#F5A623);color:#241800;font-weight:700;box-shadow:0 0 18px rgba(245,166,35,.35)}
.grn{background:linear-gradient(135deg,#6EE7B7,#16A34A);color:#04210f;font-weight:700;box-shadow:0 0 18px rgba(34,197,94,.45)}
.blu{background:linear-gradient(135deg,#7DD3FC,#2563EB);color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:0 0 18px rgba(56,189,248,.5)}
.vio{background:linear-gradient(135deg,#A78BFA,#7C3AED);color:#fff;font-weight:700;box-shadow:0 0 18px rgba(139,92,246,.55)}
.scr{display:none}.scr.on{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes br{0%,100%{box-shadow:0 0 14px rgba(245,196,81,.25),inset 0 0 0 1px rgba(245,196,81,.5)}50%{box-shadow:0 0 42px rgba(245,196,81,.65),inset 0 0 0 1px rgba(245,196,81,.95)}}
.pulse{animation:br 2.6s infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(6deg)}}.fl{animation:fl 3.5s ease-in-out infinite}
@keyframes sh{from{background-position:-200% 0}to{background-position:200% 0}}
.banner{background:linear-gradient(110deg,#2a1d04 20%,#7a5510 40%,#f5c451 50%,#7a5510 60%,#2a1d04 80%);background-size:200% 100%;animation:sh 4s linear infinite}
.gv{background-image:linear-gradient(rgba(139,92,246,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,.2) 1px,transparent 1px),linear-gradient(135deg,#221344,#0f0b1c);background-size:22px 22px,22px 22px,100% 100%;box-shadow:0 0 26px rgba(139,92,246,.3),inset 0 0 0 1px rgba(167,139,250,.45)}
#sky{position:fixed;inset:0;z-index:0;display:none;pointer-events:none;overflow:hidden;background:radial-gradient(600px 400px at 50% 0,rgba(124,58,237,.35),transparent),linear-gradient(#080510,#050607)}
#sky.on{display:block}
#sky:before{content:"";position:absolute;inset:-40px;background-image:linear-gradient(rgba(139,92,246,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,.18) 1px,transparent 1px);background-size:36px 36px;animation:gm 6s linear infinite}
@keyframes gm{to{transform:translateY(36px)}}
.st{position:absolute;bottom:-40px;filter:drop-shadow(0 0 8px #A78BFA);animation:up linear infinite}
@keyframes up{to{transform:translateY(-115vh) rotate(180deg)}}
.inp{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--bd);border-radius:14px;padding:14px;outline:none;color:var(--tx)}
.inp:focus{border-color:#F5C451;box-shadow:0 0 12px rgba(245,196,81,.3)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:14px}
.ov.on{display:flex}.ov>div{width:100%;max-width:400px;max-height:92vh;overflow-y:auto;animation:in .25s ease}
.sheetbg{background:#0C1015!important}.light .sheetbg{background:#fff!important}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--gl);font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.a{border-color:#F5C451;box-shadow:0 0 10px rgba(245,196,81,.4);color:#F5C451}
.dot{width:8px;height:8px;border-radius:50%}
.vc{background:linear-gradient(135deg,#1c222b,#0a0d11 70%);border:1px solid rgba(245,196,81,.35);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 18px rgba(245,196,81,.15);color:#E8ECF1}
.ok{background:#22c55e!important;color:#04210f!important}
.pk{box-shadow:inset 0 0 0 1px rgba(245,196,81,.2);transition:box-shadow .2s,transform .15s}.pk:hover{box-shadow:0 0 22px rgba(245,196,81,.5),inset 0 0 0 1px rgba(245,196,81,.9)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;font-size:11px;color:#8A94A3;transition:color .25s,filter .25s}
.tab svg{transition:filter .25s}.tab.a{color:#F5C451}.tab.a svg{filter:drop-shadow(0 0 6px rgba(245,196,81,.9))}
.sel{border-color:#F5C451!important;box-shadow:0 0 24px rgba(245,196,81,.75),inset 0 0 0 1px #F5C451!important}
.gal{background-image:radial-gradient(circle at 20% 30%,rgba(236,72,153,.28),transparent 40%),radial-gradient(circle at 85% 70%,rgba(59,130,246,.28),transparent 45%),linear-gradient(rgba(139,92,246,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,.15) 1px,transparent 1px),linear-gradient(135deg,#221344,#07090B)!important;background-size:100% 100%,100% 100%,22px 22px,22px 22px,100% 100%!important}
#payBtn{background:linear-gradient(135deg,#34d399,#16a34a);color:#04210f;box-shadow:0 0 22px rgba(34,197,94,.45);width:100%}#payBtn:disabled{opacity:.35;box-shadow:none;cursor:not-allowed}
#home.on{display:flex;flex-direction:column;min-height:calc(100vh - var(--sat) - var(--sab) - 106px);min-height:calc(100dvh - var(--sat) - var(--sab) - 106px)}
.hb{flex:1 1 0;min-height:165px;max-height:280px}
.gs{background:linear-gradient(110deg,#8a5a00,#F5C451 25%,#FFF1B8 50%,#F5C451 75%,#8a5a00);background-size:200% 100%;animation:sh 5s linear infinite;color:#2a1a00;font-weight:800;letter-spacing:.06em;text-align:center;border-radius:14px;padding:9px 12px;font-size:13px;box-shadow:0 0 20px rgba(245,196,81,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.brand{background:linear-gradient(100deg,#FFF3C4,#F5C451 35%,#C98A12 65%,#FFE08A);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.02em;filter:drop-shadow(0 0 10px rgba(245,196,81,.3))}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}.tw{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
#pubg.on{display:flex;flex-direction:column;height:calc(100vh - var(--sat) - var(--sab) - 106px);height:calc(100dvh - var(--sat) - var(--sab) - 106px)}
#pubg #ug{flex:0 0 auto}
#selbar{margin-top:auto;animation:in .3s ease}
#prem{--gl:rgba(12,16,21,.78);--tx:#E8ECF1;--mu:#8A94A3;--bd:rgba(255,255,255,.06);color:var(--tx)}
.light .brand{background:linear-gradient(100deg,#6B3E00,#B97A0A 40%,#9A3412 75%,#6B3E00);-webkit-background-clip:text;background-clip:text;filter:none}
@keyframes ss{0%{transform:translate(0,0);opacity:0}8%{opacity:1}35%{transform:translate(-190px,110px);opacity:0}100%{transform:translate(-190px,110px);opacity:0}}.ss{animation:ss 6s ease-in infinite}
</style>
</head>

  $('#cs').innerHTML=`<div class="w-16 shrink-0">${ucArt(sel,'w-16 h-14')}</div><div class="flex-1"><div class="font-bold">UC / PUBG MOBILE</div><div class="mu text-sm">${u} UC</div></div><div class="font-bold" style="color:#F5C451">${fm(p)}</div>`;
  $('#vr').innerHTML=vok?`<div class="mt-3 p-3 rounded-xl font-bold" style="background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.5);color:#4ade80;box-shadow:0 0 14px rgba(34,197,94,.25)">${t('usr')}: @zxc_flex ✅</div>`:'';$('#payBtn').disabled=!vok}
function ver(){const v=$('#cid').value.trim(),b=$('#vb');if(!/^\d{6,}$/.test(v))return toast(t('pid6'));
  b.textContent='...';setTimeout(()=>{b.textContent=t('tek');vok=true;chkRender()},900)}
function pay(){if(!vok||sel===null)return;buy('PUBG '+UC[sel][0]+' UC',UC[sel][1])}
function vu(){const v=$('#un').value.trim();if(!/^@[A-Za-z0-9_]{5,}$/.test(v))return toast(t('unv'));
  $('#ur').innerHTML=`<div class="mt-3 p-3 rounded-xl font-bold" style="background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.5);color:#4ade80">${v} ✅ ${t('fnd')}</div>`}

/* BALANCE LOGIC: user_balance >= product_price -> success, otherwise top-up flow */
function buy(name,price){
  if(bal>=price)return confirmBuy(name,price);lack(price-bal)}
function confirmBuy(name,price){sheet(`<div class="text-center"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#F5C451" stroke-width="2" stroke-linecap="round" style="margin:0 auto"><circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01"/></svg><h3 class="text-xl font-bold mt-3">${t('cfT')}</h3></div><div class="glass p-3 mt-4 text-sm space-y-2"><div class="flex justify-between gap-3"><span class="mu">${t('cfX')}</span><b>${tn(name)}</b></div><div class="flex justify-between gap-3"><span class="mu">${t('cfA')}</span><b style="color:#F5C451">${fm(price)}</b></div><div class="flex justify-between gap-3"><span class="mu">${t('cfL')}</span><b>${fm(bal-price)}</b></div></div><button class="btn gold w-full rounded-xl py-3 mt-4" onclick="doBuy('${name}',${price})">${t('yes')}</button><button class="btn w-full rounded-xl py-3 mt-2 mu" onclick="cl()">${t('cancel')}</button>`)}
function doBuy(name,price){
  if(bal<price)return lack(price-bal);{bal-=price;H.unshift({t:name,a:-price,s:'d',d:now()});upd();
    sheet(`<div class="text-center"><svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" style="filter:drop-shadow(0 0 10px #22c55e);margin:0 auto"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.500l3 3 6-6.500"/></svg><h3 class="text-xl font-bold mt-3">${t('succ')}</h3><p class="mu mt-2">${tn(name)} — ${fm(price)}</p></div><button class="btn gold w-full rounded-xl py-3 mt-4" onclick="cl();nav('home')">${t('close')}</button>`);
  }}
function lack(m){sheet(`<div class="text-center"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#F5C451" stroke-width="2" stroke-linecap="round" style="margin:0 auto"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg><h3 class="text-xl font-bold mt-2">${t('lack')}</h3>
<p class="mu mt-2">${t('miss')}</p><div class="text-2xl font-bold my-2" style="color:#F5C451">${fm(m)}</div></div>
<button class="btn gold w-full rounded-xl py-3 mt-3" onclick="topSheet(${m})">${t('dep')}</button><button class="btn w-full rounded-xl py-3 mt-2 mu" onclick="cl()">${t('cancel')}</button>`)}

function topSheet(pre){meth=0;sheet(`<h3 class="text-xl font-bold mb-3">${t('tt')}</h3>
<input id="am" class="inp mb-3" inputmode="numeric" placeholder="${t('amp')}" value="${pre?Math.ceil(pre/1000)*1000:''}">
<div class="flex gap-2 mb-4 flex-wrap">${[20000,50000,100000].map(n=>`<button class="btn chip" onclick="$('#am').value=${n}">${fm(n)}</button>`).join('')}</div>
<div class="mu text-sm mb-2">${t('met')}</div>
<div class="grid grid-cols-1 gap-2 mb-4" id="mt">${CARDS.map((c,i)=>`<button class="btn chip justify-center ${i?'':'a'}" onclick="pm(${i})">${c.l}</button>`).join('')}</div>
<button class="btn gold w-full rounded-xl py-3" onclick="inv()">${t('go')}</button>`)}
function pm(i){meth=i;$$('#mt .chip').forEach((b,j)=>b.classList.toggle('a',i===j))}

function inv(){amt=parseInt($('#am').value.replace(/\D/g,''))||0;if(amt<10000)return toast(t('min'));const c=CARDS[meth];
  sheet(`<div class="flex flex-col items-center mb-4"><div class="relative w-32 h-32"><svg viewBox="0 0 120 120" class="-rotate-90"><circle cx="60" cy="60" r="54" fill="none" stroke="rgba(128,128,128,.2)" stroke-width="7"/><circle id="tc" cx="60" cy="60" r="54" fill="none" stroke="#F5C451" stroke-width="7" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="0" style="filter:drop-shadow(0 0 6px #F5C451);transition:stroke-dashoffset 1s linear"/></svg><div id="tt" class="absolute inset-0 flex items-center justify-center text-2xl font-bold">07:00</div></div>
<div class="mu text-xs mt-2">${t('tl')}</div><div class="mu text-sm mt-1">${t('sum')}</div><div class="font-bold text-xl" style="color:#F5C451">${fm(amt)}</div></div>
<div class="p-3 rounded-xl text-sm font-bold mb-3" style="background:rgba(245,166,35,.12);border:1px solid rgba(245,196,81,.55);color:#F5C451">${t('warn').replace('{a}',fm(amt))}</div>
<div class="vc p-5 mb-3"><div class="flex justify-between items-center mb-5"><div class="w-10 h-7 rounded" style="background:linear-gradient(135deg,#FFE08A,#b8860b)"></div><div class="text-xs" style="color:#8A94A3">${c.l}</div></div>
<div class="text-xl font-bold tracking-widest mb-3">${c.n}</div>
<div class="flex justify-between items-center"><div><div class="text-[10px]" style="color:#8A94A3">${t('hold')}</div><div class="text-sm font-bold">${HOLDER}</div></div><button class="btn gold rounded-lg px-3 py-2 text-xs" onclick="cp('${c.n.replace(/\s/g,'')}',this)">${t('cp')}</button></div></div>
<ol class="text-sm mu space-y-1 mb-4 list-decimal pl-5"><li>${t('s1')}</li><li>${t('s2').replace('{a}',fm(amt))}</li><li>${t('s3')}</li><li>${t('s4')}</li></ol>
<button class="btn gold w-full rounded-xl py-3" onclick="paid()">${t('paid')}</button><button class="btn w-full rounded-xl py-2 mt-1 mu text-sm" onclick="cl()">${t('cancel')}</button>`);tick()}
function tick(){let s=420;clearInterval(tmr);tmr=setInterval(()=>{s--;const e=$('#tt');if(!e)return clearInterval(tmr);
  e.textContent=String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');$('#tc').style.strokeDashoffset=339.3*(1-s/420);
  if(s<=0){cl();H.unshift({t:'{topH}',a:amt,s:'c',d:now()});upd();toast(t('exp'))}},1000)}
function cp(v,b){const ok=()=>{b.textContent='✔ '+t('cpd');b.classList.add('ok');setTimeout(()=>{b.textContent=t('cp');b.classList.remove('ok')},2000)};
  navigator.clipboard?navigator.clipboard.writeText(v).then(ok,ok):ok()}
function paid(){const it={t:'{topH}',a:amt,s:'p',d:now()},a=amt;H.unshift(it);cl();upd();toast(t('chkg'));
  setTimeout(()=>{it.s='d';bal+=a;upd();toast(t('ok')+' ✅')},4000)}

/* history / wallet */
const row=x=>`<div class="glass p-3 flex items-center gap-3"><span class="dot" style="background:${ST[x.s]};box-shadow:0 0 8px ${ST[x.s]}"></span><div class="flex-1"><div class="font-bold text-sm">${tn(x.t)}</div><div class="mu text-xs">${x.d} · ${t('f_'+x.s)}</div></div><div class="font-bold text-sm" style="color:${x.a>0?'#4ade80':'var(--tx)'}">${x.a>0?'+':'−'}${fm(x.a)}</div></div>`;
const crate=()=>`<div class="text-center py-10"><svg width="150" height="150" viewBox="0 0 150 150"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#B8730B"/></linearGradient></defs><path d="M20 55Q75-5 130 55Z" fill="#8B5CF6" opacity=".85"/><path d="M20 55 65 100M130 55 85 100M75 40V100" stroke="#C4B5FD" stroke-width="1.5"/><path d="M50 100h50v36H50z" fill="url(#g1)"/><path d="M50 100l12-10h50l-12 10z" fill="#FFE08A"/><path d="M100 100l12-10v36l-12 10z" fill="#8a5508"/><path d="M50 112h50M75 100v36" stroke="#4a2c00" stroke-width="3"/></svg><div class="font-bold mt-2">${t('em')}</div><div class="mu text-sm">${t('em2')}</div></div>`;
function upd(){$('#b1').textContent=$('#b2').textContent=fm(bal);
  $('#fc').innerHTML=['all','p','d','c'].map(k=>`<button class="btn chip ${hf===k?'a':''}" onclick="hf='${k}';upd()"><span class="dot" style="background:${k==='all'?'#34d399':ST[k]}"></span>${t('f_'+k)}</button>`).join('');
  const A=H.filter(x=>hf==='all'||x.s===hf);$('#hl').innerHTML=A.length?A.map(row).join(''):crate();
  const W=H.filter(x=>x.s!=='c');$('#wl').innerHTML=W.length?W.map(row).join(''):`<div class="mu text-sm text-center py-6">${t('noop')}</div>`}

/* i18n engine */
function applyLang(){$$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$$('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));
  document.documentElement.lang=L?'ru':'uz';$('#lg').textContent=L?'Русский':"O'zbekcha";
  $('#ur').innerHTML='';chkRender();drawTabs({pubg:'home',prem:'home',chk:'home'}[cur]||cur);products();selRender();thLbl();upd()}
function tl(){L=1-L;cl();applyLang()}
function rules(){sheet(`<h3 class="font-bold text-lg mb-2">${t('rul')}</h3><p class="mu text-sm mb-4">${t('rx')}</p><button class="btn gold w-full rounded-xl py-3" onclick="cl()">${t('close')}</button>`)}
function th(){const l=document.body.classList.toggle('light');thLbl()}
function thLbl(){$('#tm').textContent=document.body.classList.contains('light')?t('lt'):t('dk')}
